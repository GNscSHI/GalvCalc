[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GalvCalc"
version = "1.0.0"
description = "A computational framework for modeling micro-galvanic corrosion of alloys with coupled anodic dissolution and hydrogen evolution kinetics"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Gaoning Shi", email = "gaoning_shi@sjtu.edu.cn"},
]
keywords = [
    "corrosion", "galvanic corrosion", "electrochemistry", "density functional theory",
    "materials science", "hydrogen evolution", "pymatgen", "polarization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "PyYAML>=5.4",
    "sympy>=1.9",
    "pymatgen>=2023.10.4",
    "tqdm>=4.60",
    "joblib>=1.1",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
defects = [
    "pymatgen>=2024.10,<2027",
    "pymatgen-analysis-defects>=2024.10,<2027",
    "scikit-image>=0.19",
    "mp-pyrho>=0.4.4",
]
ml = [
    "torch>=1.10",
    "scikit-learn>=1.0",
    "tabpfn>=0.1.9",
]
examples = [
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]
dev = [
    "pytest>=7.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/GNscSHI/GalvCalc"
Documentation = "https://github.com/GNscSHI/GalvCalc#readme"
Source = "https://github.com/GNscSHI/GalvCalc"

[project.scripts]
galvcalc = "GalvCalc.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["GalvCalc*"]

[tool.setuptools.package-data]
GalvCalc = [
    "core/*.yaml",
    "assets/*.png",
    "predictor/Eads/data/*.json",
    "predictor/Eads/data/*.xlsx",
    "predictor/Eads/data/*.md",
    "predictor/Eads/utils/*.pkl",
    "predictor/surface_properties/*.json",
    "predictor/surface_properties/models/*.pth.tar",
    "examples/*.poscar",
    "examples/*.vasp",
    "examples/*.csv",
    "examples/galvcalc_demo.ipynb",
    "examples/surface/*.vasp",
    "examples/demo_output/*.png",
]

[tool.setuptools.exclude-package-data]
GalvCalc = [
    "examples/**/*.ipynb_checkpoints/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "ml: tests that require machine-learning dependencies (torch/tabpfn)",
]
